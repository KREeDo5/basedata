name: Deploy to GitHub Pages

on:
  push:
    branches:
      - frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.17.0'

      - name: Install dependencies
        run: npm install
        working-directory: ./forum

      - name: Build project
        run: npm run build
        working-directory: ./forum

      - name: Check build directory
        run: if [ -d "./forum/dist" ]; then echo "Build directory exists"; else echo "Build directory does not exist"; fi
        working-directory: .

      - name: List files in dist directory
        run: ls -la ./dist
        working-directory: .

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: KREeDo5/KREeDo5.github.io
          publish_dir: ./dist
          publish_branch: gh-pages-vue